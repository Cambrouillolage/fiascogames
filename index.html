  <!-- Redirection vers /accueil/. GitHub Pages ne permet pas de vraie
       redirection serveur : le script part en premier pour être le plus
       rapide possible, conserve ?paramètres et #ancre (fbclid, utm_*…
       indispensables au suivi des pubs) et utilise replace() pour ne pas
       laisser cette page dans l'historique (le bouton Retour ne ramène pas
       ici en boucle). Le meta refresh n'est qu'un secours sans JavaScript.
       Les balises de partage sont copiées de la page cible pour que les
       aperçus Facebook/Instagram/WhatsApp soient corrects même si leur
       robot ne suit pas la redirection. -->
  <script>location.replace("/accueil/" + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/accueil/" />
