<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GAV - Admin conversations</title>
  <meta name="robots" content="noindex,nofollow" />
  <!--
    Page non liée dans la navigation du site. Ce n'est PAS la sécurité :
    l'accès aux données est contrôlé par Supabase Auth + Row Level Security
    (voir supabase/migrations/0001_gav_chat.sql) — un visiteur qui trouve
    cette URL ne voit qu'un formulaire de connexion et ne peut lire aucune
    conversation sans le compte admin.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f3ede1;
      --bg-2:#f9f5ec;
      --dark:#131313;
      --ink:#1f1f1f;
      --muted:#625a50;
      --line:#dfd3be;
      --orange:#ea6f11;
      --orange-2:#ff9e44;
      --white:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .container{width:min(1100px, calc(100% - 32px)); margin:0 auto; padding:28px 0 56px}
    h1{
      font-family:"Bebas Neue","Impact",sans-serif;
      text-transform:uppercase;
      font-size:clamp(26px, 5vw, 36px);
      margin:0 0 18px;
      color:var(--dark);
    }

    .card{
      border:2px solid var(--line);
      border-radius:16px;
      background:var(--white);
      padding:20px;
    }

    /* --- Connexion --- */
    #loginView{max-width:380px; margin:60px auto 0}
    #loginView .card{box-shadow:4px 5px 0 #c9822f; border-color:#dba25a}
    #loginForm{display:flex; flex-direction:column; gap:12px}
    #loginForm label{font-size:13px; font-weight:800; color:var(--muted)}
    #loginForm input{
      border:2px solid var(--line);
      border-radius:10px;
      padding:9px 12px;
      font-size:14px;
      font-family:inherit;
    }
    .btn{
      border:2px solid rgba(255,255,255,.2);
      border-radius:12px;
      padding:10px 16px;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(180deg, #ff9e44, #ea6f11);
      box-shadow:0 5px 0 #b34f09, 0 12px 22px rgba(234,111,17,.35);
      transition:transform .16s ease, filter .16s ease;
    }
    .btn:hover{transform:translateY(-2px); filter:brightness(1.06)}
    .btn:active{transform:translateY(3px)}
    .btn:disabled{opacity:.55; cursor:not-allowed; transform:none}
    .btnGhost{
      background:transparent;
      color:var(--ink);
      border-color:var(--line);
      box-shadow:none;
    }
    .errorText{color:#b3261e; font-size:13px; min-height:16px}

    /* --- Dashboard --- */
    #dashView{display:none}
    .topBar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap}
    .who{font-size:13px; color:var(--muted)}

    .layout{display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start}
    @media (max-width:820px){.layout{grid-template-columns:1fr}}

    .convList{max-height:75vh; overflow-y:auto; padding:8px}
    .convItem{
      display:block; width:100%; text-align:left; border:none; background:transparent;
      padding:12px; border-radius:10px; cursor:pointer; margin-bottom:4px;
    }
    .convItem:hover, .convItem.active{background:var(--bg-2)}
    .convItem .cTop{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); margin-bottom:4px}
    .convItem .cPreview{font-size:13.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .badge{
      display:inline-block; font-size:11px; font-weight:800; padding:2px 8px;
      border-radius:999px; background:var(--orange-2); color:#fff;
    }

    .thread{padding:8px; min-height:200px}
    .thread .msg{max-width:88%; padding:10px 14px; border-radius:14px; margin-bottom:10px; line-height:1.45; font-size:14px; white-space:pre-wrap}
    .thread .msg.user{margin-left:auto; background:linear-gradient(180deg, var(--orange-2), var(--orange)); color:#fff}
    .thread .msg.assistant{background:var(--bg-2); border:1px solid var(--line)}
    .thread .msgMeta{font-size:11px; color:var(--muted); margin:0 0 3px}

    .empty{color:var(--muted); font-size:14px; padding:20px}
  </style>
</head>
<body>
  <div class="container">
    <h1>GAV — Conversations du chat</h1>

    <div id="loginView">
      <div class="card">
        <form id="loginForm">
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
          <p class="errorText" id="loginError"></p>
          <button type="submit" class="btn" id="loginBtn">Se connecter</button>
        </form>
      </div>
    </div>

    <div id="dashView">
      <div class="topBar">
        <span class="who" id="whoAmI"></span>
        <button class="btn btnGhost" id="logoutBtn">Se déconnecter</button>
      </div>
      <div class="layout">
        <div class="card convList" id="convList"></div>
        <div class="card thread" id="thread"><p class="empty">Sélectionnez une conversation.</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ⚠️ TODO (Florian) : mêmes valeurs que dans gav/video/index.html
    // (Dashboard Supabase → Project Settings → API).
    const SUPABASE_URL = "https://wrguanxvvpqzoaesxcfk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyZ3Vhbnh2dnBxem9hZXN4Y2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjEwMjIsImV4cCI6MjEwMzM5NzAyMn0.NsODcMAh2J-nUD6dGheZOeF4ykXl-e3aKCONCNyvLUg";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginView = document.getElementById("loginView");
    const dashView = document.getElementById("dashView");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");
    const whoAmI = document.getElementById("whoAmI");
    const logoutBtn = document.getElementById("logoutBtn");
    const convListEl = document.getElementById("convList");
    const threadEl = document.getElementById("thread");

    let conversations = [];
    let activeConvId = null;

    function fmtDate(iso) {
      return new Date(iso).toLocaleString("fr-FR", {
        day: "2-digit", month: "2-digit", year: "2-digit",
        hour: "2-digit", minute: "2-digit",
      });
    }

    async function loadConversations() {
      const { data, error } = await supabase
        .from("conversations")
        .select("id, created_at, last_message_at, message_count, messages(role, content, created_at)")
        .eq("game", "gav")
        .order("last_message_at", { ascending: false });

      if (error) {
        convListEl.innerHTML = `<p class="empty">Erreur de chargement : ${error.message}</p>`;
        return;
      }

      conversations = data ?? [];
      if (conversations.length === 0) {
        convListEl.innerHTML = '<p class="empty">Aucune conversation pour le moment.</p>';
        return;
      }

      convListEl.innerHTML = "";
      for (const conv of conversations) {
        const msgs = (conv.messages ?? []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const lastUserMsg = [...msgs].reverse().find((m) => m.role === "user");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "convItem";
        btn.dataset.id = conv.id;
        btn.innerHTML = `
          <div class="cTop">
            <span>${fmtDate(conv.last_message_at)}</span>
            <span class="badge">${conv.message_count} msg</span>
          </div>
          <div class="cPreview">${(lastUserMsg?.content ?? "(vide)").slice(0, 80)}</div>
        `;
        btn.addEventListener("click", () => showThread(conv.id));
        convListEl.appendChild(btn);
      }
    }

    function showThread(id) {
      activeConvId = id;
      document.querySelectorAll(".convItem").forEach((el) => {
        el.classList.toggle("active", el.dataset.id === id);
      });
      const conv = conversations.find((c) => c.id === id);
      if (!conv) return;
      const msgs = (conv.messages ?? []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      threadEl.innerHTML = "";
      for (const m of msgs) {
        const wrap = document.createElement("div");
        const meta = document.createElement("p");
        meta.className = "msgMeta";
        meta.textContent = `${m.role === "user" ? "Visiteur" : "Assistant"} · ${fmtDate(m.created_at)}`;
        const bubble = document.createElement("div");
        bubble.className = "msg " + m.role;
        bubble.textContent = m.content;
        wrap.appendChild(meta);
        wrap.appendChild(bubble);
        threadEl.appendChild(wrap);
      }
    }

    async function enterDashboard(session) {
      loginView.style.display = "none";
      dashView.style.display = "block";
      whoAmI.textContent = `Connecté en tant que ${session.user.email}`;
      await loadConversations();
      if (conversations.length === 0) {
        threadEl.innerHTML = '<p class="empty">Aucune conversation visible avec ce compte.</p>';
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      loginBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      loginBtn.disabled = false;
      if (error) {
        loginError.textContent = "Connexion impossible : " + error.message;
        return;
      }
      await enterDashboard(data.session);
    });

    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      dashView.style.display = "none";
      loginView.style.display = "block";
      convListEl.innerHTML = "";
      threadEl.innerHTML = '<p class="empty">Sélectionnez une conversation.</p>';
    });

    // Session déjà active (retour sur la page) ?
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      await enterDashboard(session);
    }
  </script>
</body>
</html>
